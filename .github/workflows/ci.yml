name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore api/AssetKeeper.slnx
      - run: dotnet build api/AssetKeeper.slnx --no-restore -c Release
      # 真实 PostgreSQL 测试需要显式设置 ASSET_KEEPER_TEST_CONNECTION，CI 中不启用。
      - run: dotnet test api/AssetKeeper.slnx --no-build -c Release

  frontend:
    name: 前端检查、测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
