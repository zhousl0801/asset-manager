services:
  - type: web
    name: asset-manager-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      # 二选一：优先配置 PBKDF2 散列，未配置时回退到明文口令。
      - key: ASSET_KEEPER_ACCESS_PASSWORD_HASH
        sync: false
      - key: ASSET_KEEPER_ACCESS_PASSWORD
        sync: false
      # Passkey 默认使用 Render 注入的 RENDER_EXTERNAL_URL 推断依赖方地址；
      # 绑定自定义域名后再设置下面两项（值为实际域名与完整 https 地址）。
      # - key: Passkey__RpId
      #   value: example.com
      # - key: Passkey__Origins__0
      #   value: https://example.com
